name: Engineering quality tools
description: Install a pinned standards revision without running consumer install scripts
outputs:
  checker:
    description: Absolute path to engineering-checks
    value: ${{ steps.install.outputs.checker }}
  tools:
    description: Absolute path to pinned Node tools
    value: ${{ steps.install.outputs.tools }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - id: install
      shell: bash
      env:
        STANDARDS_PATH: ${{ github.action_path }}
      run: |
        python -m pip install uv==0.11.15
        cd "$STANDARDS_PATH"
        uv sync --frozen
        npm ci --ignore-scripts
        echo "checker=$STANDARDS_PATH/.venv/bin/engineering-checks" >> "$GITHUB_OUTPUT"
        echo "tools=$STANDARDS_PATH/node_modules/.bin" >> "$GITHUB_OUTPUT"
