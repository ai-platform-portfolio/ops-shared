[project]
name = "engineering-checks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter-language-pack==0.10.0",
  "python-hcl2==7.3.1",
  "PyYAML==6.0.2",
  "types-PyYAML==6.0.12.20250516",
  "ruff==0.11.13",
  "mypy==1.16.0",
]

[project.scripts]
engineering-checks = "checks.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
