name: Deploy Foundry agent
description: Deploy one native azure.yaml agent service using Azure Developer CLI and GitHub OIDC.

inputs:
  service:
    description: Agent service key in the caller's azure.yaml.
    required: true

  environment:
    description: Native azd environment name.
    required: true

  working-directory:
    description: Directory containing the caller's azure.yaml.
    default: .

  client-id:
    description: Existing Azure identity with GitHub federated trust.
    required: true

  tenant-id:
    description: Azure identity tenant ID.
    required: true

  subscription-id:
    description: Target Azure subscription.
    required: true

  location:
    description: Azure location for the native azd environment.
    required: true

  azd-version:
    description: Version installed only when azd is absent. Existing compatible installations are reused.
    default: 1.37.3

  image:
    description: Optional prebuilt image pinned by sha256; azure.yaml references HOSTED_AGENT_IMAGE.
    default: ''

  preserve-serving-version:
    description: Pin the existing single serving version before deploying a candidate. Reject split routes.
    default: 'false'

  source-revision:
    description: Source commit recorded in the agent runtime environment.
    default: ${{ github.sha }}

  traces-endpoint:
    description: Optional OTLP HTTP traces URL. Empty disables this collector export.
    default: ''

outputs:
  version:
    description: Actual ready candidate version, verified against the supplied image.
    value: ${{ steps.release.outputs.version }}

  serving-version:
    description: Previously serving version preserved during candidate deployment; empty on first release.
    value: ${{ steps.prepare.outputs.serving-version }}

  record:
    description: Local path to the verified release record for caller-owned acceptance and publication.
    value: ${{ steps.release.outputs.record }}

runs:
  using: composite
  steps:
    - name: Check for Azure Developer CLI
      id: azd
      shell: bash
      run: |
        if command -v azd >/dev/null 2>&1; then
          echo 'installed=true' >> "$GITHUB_OUTPUT"
        else
          echo 'installed=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Install Azure Developer CLI when missing
      if: steps.azd.outputs.installed != 'true'
      uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
      with:
        version: ${{ inputs.azd-version }}

    - name: Install Foundry agent extension
      shell: bash
      run: azd extension install azure.ai.agents --version 1.0.0 --no-prompt

    - name: Authenticate with GitHub OIDC
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ inputs.client-id }}
        AZURE_TENANT_ID: ${{ inputs.tenant-id }}
      run: |
        azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" \
          --federated-credential-provider github --no-prompt

    - name: Select or create local azd environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AZURE_ENV_NAME: ${{ inputs.environment }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        AZURE_LOCATION: ${{ inputs.location }}
      run: |
        if [[ -f ".azure/$AZURE_ENV_NAME/.env" ]]; then
          azd env select "$AZURE_ENV_NAME" --no-prompt
        else
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --no-prompt
        fi
        azd env set "AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" "AZURE_LOCATION=$AZURE_LOCATION" \
          --environment "$AZURE_ENV_NAME" --no-prompt

    - name: Select prebuilt image when supplied
      if: inputs.image != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        AZURE_ENV_NAME: ${{ inputs.environment }}
      run: |
        [[ "$IMAGE" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
          echo 'A registry-qualified image pinned by sha256 is required.' >&2
          exit 1
        }
        azd env set "HOSTED_AGENT_IMAGE=$IMAGE" AZD_AGENT_SKIP_ACR=true \
          --environment "$AZURE_ENV_NAME" --no-prompt

    - name: Configure release metadata and optional tracing
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOURCE_REVISION: ${{ inputs.source-revision }}
        IMAGE: ${{ inputs.image }}
        TRACES_ENDPOINT: ${{ inputs.traces-endpoint }}
        AZURE_ENV_NAME: ${{ inputs.environment }}
      run: |
        : "${FOUNDRY_PROJECT_ENDPOINT:?Existing project endpoint is required}"
        azd env set "SOURCE_REVISION=$SOURCE_REVISION" "RELEASE_IMAGE=$IMAGE" \
          "AGENT_TRACES_ENDPOINT=$TRACES_ENDPOINT" "FOUNDRY_PROJECT_ENDPOINT=$FOUNDRY_PROJECT_ENDPOINT" \
          --environment "$AZURE_ENV_NAME" --no-prompt

    - name: Ensure YAML support for native configuration edits
      shell: bash
      run: |
        python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

    - name: Prepare native agent identity and preserve serving route
      id: prepare
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVICE: ${{ inputs.service }}
        AZURE_ENV_NAME: ${{ inputs.environment }}
        PRESERVE_SERVING_VERSION: ${{ inputs.preserve-serving-version }}
      run: python3 "${{ github.action_path }}/release.py" prepare "$SERVICE"

    - name: Deploy selected Foundry agent
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVICE: ${{ inputs.service }}
        AZURE_ENV_NAME: ${{ inputs.environment }}
      run: |
        : "${SERVICE:?service is required}" "${AZURE_ENV_NAME:?environment is required}"
        azd deploy --environment "$AZURE_ENV_NAME" --no-prompt -- "$SERVICE"

    - name: Read back candidate identity
      id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVICE: ${{ inputs.service }}
        AZURE_ENV_NAME: ${{ inputs.environment }}
        IMAGE: ${{ inputs.image }}
        SOURCE_REVISION: ${{ inputs.source-revision }}
      run: python3 "${{ github.action_path }}/release.py" record "$SERVICE"
