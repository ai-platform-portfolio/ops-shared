name: Test release publication actions

on:
  pull_request:
    paths: ['.github/actions/publish-release/**', '.github/actions/acr-*/**', '.github/actions/atlas-repository/**', 'scripts/foundry_deploy.py', 'tests/test_*.py', '.github/workflows/foundry-deploy.yml', '.github/workflows/publish-release-test.yml']
  push:
    branches: [main]
    paths: ['.github/actions/publish-release/**', '.github/actions/acr-*/**', '.github/actions/atlas-repository/**', 'scripts/foundry_deploy.py', 'tests/test_*.py', '.github/workflows/foundry-deploy.yml', '.github/workflows/publish-release-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      - run: python3 -m pip install PyYAML==6.0.3 azure-ai-projects==2.7.0 azure-identity==1.27.0 httpx==0.28.1

      - run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
