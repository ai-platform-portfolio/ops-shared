name: Test preview record publisher

on:
  pull_request:
    paths: ['.github/actions/publish-preview/**', 'tests/test_preview_publication.py', '.github/workflows/publish-preview-test.yml']
  push:
    branches: [main]
    paths: ['.github/actions/publish-preview/**', 'tests/test_preview_publication.py', '.github/workflows/publish-preview-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s tests -p 'test_preview_publication.py' -v
