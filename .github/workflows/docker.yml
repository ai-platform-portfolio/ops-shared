name: Build Docker image

on:
  workflow_call:
    inputs:
      image:
        description: Repository path in localacrk8s without a tag (for example portfolio/api).
        required: true
        type: string

      context:
        description: Caller-relative build context.
        type: string
        default: .

      file:
        description: Caller-relative Dockerfile path; defaults to the context's Dockerfile.
        type: string
        default: ''

    secrets:
      AZURE_CREDENTIALS:
        description: Azure service principal JSON with push access to localacrk8s.
        required: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AZURE_CORE_OUTPUT: none
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: localacrk8s.azurecr.io/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}

      - name: Log in to Azure
        if: env.PUBLISH == 'true'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: env.PUBLISH == 'true'
        run: az acr login --name localacrk8s

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
