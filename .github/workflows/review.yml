name: Reusable review refresh
on:
  workflow_call:
    inputs:
      workflow:
        type: string
        default: quality.yml
      job:
        type: string
        default: policy / check
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  refresh:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/ops-shared
          ref: fdc19288e0885cb9b870bddb29a165d5a34951a9
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_WORKFLOW: ${{ inputs.workflow }}
          REVIEW_JOB: ${{ inputs.job }}
        run: python3 scripts/recheck_review.py
