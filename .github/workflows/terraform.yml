name: Infrastructure

on:
  workflow_call:
    inputs:
      root:
        type: string
        default: terraform
      backend-file:
        type: string
        default: backend.hcl
      vars-file:
        type: string
        default: ''
      preview-lock-file:
        description: OpenTofu lock file relative to checkout
        type: string
        default: ''
      terraform-version:
        type: string
        default: '1.12.2'
      tofu-version:
        type: string
        default: '1.12.3'
      plan-environment:
        type: string
        default: central-plan
      apply-environment:
        type: string
        default: central-apply
    secrets:
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      TF_BACKEND_RESOURCE_GROUP:
        required: true
      TF_BACKEND_RESOURCE_NAME:
        required: true
      TF_BACKEND_CONTAINER:
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_USE_CLI: 'false'
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_RESOURCE_NAME }}
  TF_STATE_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
  TF_ROOT: ${{ inputs.root }}
  TF_BACKEND_FILE: ${{ inputs.backend-file }}
  TF_VARS_FILE: ${{ inputs.vars-file }}

jobs:
  plan:
    name: Plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ inputs.plan-environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_ENGINE: ${{ github.event_name == 'pull_request' && 'tofu' || 'terraform' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - if: github.event_name != 'pull_request'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Select OpenTofu lock file
        if: github.event_name == 'pull_request' && inputs.preview-lock-file != ''
        env:
          LOCK_FILE: ${{ inputs.preview-lock-file }}
        run: cp "$LOCK_FILE" "$TF_ROOT/.terraform.lock.hcl"
      - name: Init
        run: |
          "$TF_ENGINE" -chdir="$TF_ROOT" init -input=false -lockfile=readonly -no-color \
            -backend-config="$TF_BACKEND_FILE" \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"
      - name: Plan
        id: plan
        run: |
          args=()
          if [ -n "$TF_VARS_FILE" ]; then args+=("-var-file=$TF_VARS_FILE"); fi
          "$TF_ENGINE" -chdir="$TF_ROOT" plan -input=false -lock-timeout=5m -no-color \
            "${args[@]}" -out="$RUNNER_TEMP/infrastructure.tfplan" 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: OpenTofu PR comment
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PLAN_RESULT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan could not run; see the workflow logs.';
            for (const [key, value] of Object.entries(process.env)) {
              if (value && value !== 'true' && value !== 'false' &&
                  /^(ARM_|TF_STATE_)|TOKEN|SECRET|PASSWORD/.test(key)) {
                plan = plan.split(value).join('[redacted]');
              }
            }
            plan = plan.replace(/\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b/gi, '[redacted-id]').replace(/```/g, "'''").slice(0, 50000);
            const marker = '<!-- infrastructure-plan -->';
            const body = `${marker}\n### OpenTofu plan (${process.env.PLAN_RESULT})\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const params = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' &&
              (c.body.includes(marker) || c.body.includes('<!-- central-infrastructure-plan -->')));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...params, body});
            }
      - name: Save plan for Apply
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infrastructure-plan
          path: ${{ runner.temp }}/infrastructure.tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.apply-environment }}
    concurrency:
      group: terraform-apply-${{ inputs.root }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Init
        run: |
          terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -no-color \
            -backend-config="$TF_BACKEND_FILE" \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"
      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: infrastructure-plan
          path: ${{ runner.temp }}
      - name: Apply
        run: terraform -chdir="$TF_ROOT" apply -input=false -lock-timeout=5m -no-color "$RUNNER_TEMP/infrastructure.tfplan"
