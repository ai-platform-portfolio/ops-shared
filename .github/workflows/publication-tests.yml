name: Test publication helpers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-source

      - run: python3 -m unittest discover -s tests -p 'test_publication.py' -v

      - name: Check Bash syntax
        run: bash -n .github/actions/check-source/check-source.sh scripts/write-artifact-record.sh

  atlas-replay:
    uses: ./.github/workflows/atlas.yml
    with:
      config: file://tests/fixtures/atlas.hcl
      environment: fixture
      directory: tests/fixtures/migrations
      lint: false
      test: false
