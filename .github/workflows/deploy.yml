name: Central infrastructure and Function deployment
on:
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'functions/**'
      - 'scripts/**'
      - 'actions/terraform/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/functions.yml'
  repository_dispatch:
    types: [repository-onboarding]
permissions:
  contents: read
  id-token: write
jobs:
  infrastructure:
    uses: ./.github/workflows/terraform.yml
    with:
      operation: ${{ github.event_name == 'repository_dispatch' && 'plan-only' || 'deploy' }}
      engine: terraform
      version: '1.12.2'
      onboarding-file: ci/onboarding.json
      approver: michaelalinks
    secrets: inherit
  function:
    needs: infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/functions.yml
    secrets: inherit
