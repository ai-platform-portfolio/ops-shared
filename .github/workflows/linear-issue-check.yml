# Local caller: runs the shared linear-issue.yml validator on ops-shared PRs.
# The linear-issue-required job is the stable check required by our main ruleset.
# Other repositories add their own caller like this, referencing the shared
# implementation in ops-shared at a full commit SHA (see README).

name: Linear issue check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  linear:
    uses: ./.github/workflows/linear-issue.yml
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
  linear-issue-required:
    if: always()
    needs: linear
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Linear validation
        env:
          RESULT: ${{ needs.linear.result }}
        run: test "$RESULT" = success
