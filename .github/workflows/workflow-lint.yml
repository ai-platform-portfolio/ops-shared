name: Reusable workflow lint
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ai-platform-portfolio/ops-shared/actions/workflow-lint@feac0efbe0f9910fb13e89c3da8698a92aa60423
