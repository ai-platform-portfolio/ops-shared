name: Deploy Foundry agent

on:
  workflow_call:
    inputs:
      agent:
        description: Logical agent name; repository identity is added to its Foundry name.
        required: true
        type: string

      image:
        description: Tagged image output from the Docker workflow.
        required: true
        type: string

      digest:
        description: Published sha256 digest; may be empty for validation-only runs.
        required: true
        type: string

      revision:
        description: Full source revision output from the Docker workflow.
        required: true
        type: string

      configuration:
        description: Caller-relative deployment.json path.
        required: true
        type: string

      smoke-file:
        description: Caller-relative smoke.json containing request and expected response fields.
        required: true
        type: string

      project-endpoint:
        description: Foundry project HTTPS endpoint; required when deploying.
        type: string
        default: ''

      deploy:
        description: Deploy on a current main push or manual run; false validates without Azure login.
        type: boolean
        default: true

    outputs:
      agent-name:
        description: Repository-scoped Foundry agent name.
        value: ${{ jobs.deploy.outputs.agent-name }}

      agent-version:
        description: Concrete version that passed candidate-specific smoke verification.
        value: ${{ jobs.deploy.outputs.agent-version }}

      image:
        description: Verified digest-pinned image; empty for validation-only runs.
        value: ${{ jobs.deploy.outputs.image }}

      revision:
        description: Verified source revision; empty for validation-only runs.
        value: ${{ jobs.deploy.outputs.revision }}

    secrets:
      AZURE_CLIENT_ID:
        required: false

      AZURE_TENANT_ID:
        required: false

      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    outputs:
      agent-name: ${{ steps.deploy.outputs.agent-name }}
      agent-version: ${{ steps.deploy.outputs.agent-version }}
      image: ${{ steps.deploy.outputs.image }}
      revision: ${{ steps.deploy.outputs.revision }}

    env:
      AGENT: ${{ inputs.agent }}
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      SOURCE_SHA: ${{ inputs.revision }}
      CONFIGURATION: ${{ inputs.configuration }}
      SMOKE_FILE: ${{ inputs.smoke-file }}
      PROJECT_ENDPOINT: ${{ inputs.project-endpoint }}
      DEPLOY: ${{ inputs.deploy }}
      AZURE_CORE_OUTPUT: none

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          path: source
          persist-credentials: false

      # Fetch only the reviewed helper, never deployment code from the caller.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/ops-shared
          ref: 8e37cde86bf30d7c4faa23de1ea09d0be2204069
          path: _ops_shared
          sparse-checkout: scripts/foundry_deploy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install official Foundry SDK
        run: python -m pip install azure-ai-projects==2.7.0 azure-identity==1.27.0 httpx==0.28.1

      - name: Validate source and deployment inputs
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo '::error::Checkout must match the full source revision.'
            exit 1
          }

          python _ops_shared/scripts/foundry_deploy.py --validate-only \
            --agent "$AGENT" --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" \
            --configuration "source/$CONFIGURATION" --smoke-file "source/$SMOKE_FILE" \
            --image "$IMAGE" --digest "$DIGEST" --project-endpoint "$PROJECT_ENDPOINT"

      - name: Require current main and publishing credentials
        if: inputs.deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]] || {
            echo '::error::Foundry deployment requires a main push or manual main run.'
            exit 1
          }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo '::error::A newer main revision exists; refusing stale deployment.'
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && -n "$PROJECT_ENDPOINT" ]] || {
            echo '::error::Deployment requires a published digest and project endpoint.'
            exit 1
          }
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name}" ]] || { echo "::error::$name is required."; exit 1; }
          done

      - name: Log in with existing Azure OIDC identity
        if: inputs.deploy
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy and smoke-test exact agent version
        if: inputs.deploy
        id: deploy
        shell: bash
        run: |
          python _ops_shared/scripts/foundry_deploy.py \
            --agent "$AGENT" --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" \
            --configuration "source/$CONFIGURATION" --smoke-file "source/$SMOKE_FILE" \
            --image "$IMAGE" --digest "$DIGEST" --project-endpoint "$PROJECT_ENDPOINT"
