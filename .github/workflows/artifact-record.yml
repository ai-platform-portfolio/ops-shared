name: Record published application artifacts

on:
  workflow_call:
    inputs:
      images:
        description: JSON map of caller-named images, each with image (tagged reference), digest and revision.
        type: string
        required: true

      migration:
        description: JSON migration identity returned by atlas.yml.
        type: string
        required: true

      migration-directory:
        description: Caller-relative migration directory for local checksum verification.
        type: string
        default: migrations

      revision:
        description: Optional full commit SHA; empty uses the event github.sha.
        type: string
        default: ''

      check-current:
        description: Reject a stale PR or main revision before upload.
        type: boolean
        default: false

      retention-days:
        description: Actions record retention; independent of image and Atlas retention.
        type: number
        default: 7

    outputs:
      revision:
        description: Verified source SHA recorded in the artifact.
        value: ${{ jobs.record.outputs.revision }}

      artifact-id:
        description: GitHub Actions artifact ID.
        value: ${{ jobs.record.outputs.artifact-id }}

permissions:
  contents: read
  pull-requests: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      revision: ${{ steps.source.outputs.revision }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      SOURCE_SHA: ${{ inputs.revision || github.sha }}
      IMAGES_JSON: ${{ inputs.images }}
      MIGRATION_JSON: ${{ inputs.migration }}
      MIGRATION_DIRECTORY: ${{ inputs.migration-directory }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      # Fetch the script from this reusable workflow's own reviewed revision.
      - name: Fetch the shared record writer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ops-shared
          sparse-checkout: scripts/write-artifact-record.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - run: bash .ops-shared/scripts/write-artifact-record.sh

      - name: Verify source before upload
        id: source
        env:
          CHECK_CURRENT: ${{ inputs.check-current }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo '::error::Source checkout does not match the selected commit.'
            exit 1
          fi
          if [[ "$CHECK_CURRENT" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
                jq -e --arg sha "$SOURCE_SHA" '.state == "open" and .head.sha == $sha' >/dev/null
            elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
              if [[ "$current" != "$SOURCE_SHA" ]]; then
                echo '::error::Main advanced beyond the selected commit.'
                exit 1
              fi
            fi
          fi
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: ${{ format('artifacts-{0}-{1}-{2}', env.SOURCE_SHA, github.run_id, github.run_attempt) }}
          path: artifacts.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
