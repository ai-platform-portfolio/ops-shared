name: Validate and publish Atlas migrations

on:
  workflow_call:
    inputs:
      config:
        description: Caller-owned Atlas config URL.
        type: string
        default: file://atlas.hcl

      environment:
        description: Environment declared in the caller's Atlas config.
        type: string
        required: true

      directory:
        description: Caller-relative migration directory, including atlas.sum.
        type: string
        default: migrations

      registry:
        description: Atlas Registry repository name; required only when publishing.
        type: string
        default: ''

      revision:
        description: Optional full commit SHA; empty uses the event github.sha.
        type: string
        default: ''

      dev-url:
        description: Optional disposable dev-database URL; empty uses the caller config.
        type: string
        default: ''

      lint:
        description: Run Pro migration lint against the Git base.
        type: boolean
        default: true

      test:
        description: Run the caller's native Atlas migration tests.
        type: boolean
        default: true

      publish:
        description: Opt into Registry publication on allowed events.
        type: boolean
        default: false

      publish-preview:
        description: Also permit publication for trusted same-repository PRs.
        type: boolean
        default: false

    outputs:
      revision:
        description: Full verified source SHA.
        value: ${{ jobs.atlas.outputs.revision }}

      published:
        description: True only when this successful call published the directory.
        value: ${{ jobs.atlas.outputs.published }}

      migration:
        description: JSON repository, tag, revision, checksum and published flag for artifact-record.yml.
        value: ${{ jobs.atlas.outputs.migration }}

    secrets:
      ATLAS_CLOUD_TOKEN:
        description: Caller-owned Atlas bot token, required for lint, test or publication.
        required: false

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      revision: ${{ steps.source.outputs.revision }}
      published: ${{ steps.record.outputs.published }}
      migration: ${{ steps.record.outputs.migration }}

    env:
      SOURCE_SHA: ${{ inputs.revision || github.sha }}
      CONFIG: ${{ inputs.config }}
      ATLAS_ENVIRONMENT: ${{ inputs.environment }}
      DIRECTORY: ${{ inputs.directory }}
      REGISTRY: ${{ inputs.registry }}
      DEV_URL: ${{ inputs.dev-url }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PUBLISH: ${{ inputs.publish && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (inputs.publish-preview && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
      ATLAS_NO_ANON_TELEMETRY: 'true'
      ATLAS_NO_UPDATE_NOTIFIER: 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected source
        id: source
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo '::error::Source checkout must match the selected full commit SHA.'
            exit 1
          fi
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require publication configuration
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo '::error::registry is required for publication.'
            exit 1
          fi

      - name: Require Atlas bot for Pro operations
        if: inputs.lint || inputs.test || env.PUBLISH == 'true'
        env:
          ATLAS_CLOUD_TOKEN: ${{ secrets.ATLAS_CLOUD_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ATLAS_CLOUD_TOKEN" ]]; then
            echo '::error::ATLAS_CLOUD_TOKEN is required for lint, test or publication.'
            exit 1
          fi

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ (inputs.lint || inputs.test || env.PUBLISH == 'true') && secrets.ATLAS_CLOUD_TOKEN || '' }}

      - name: Validate checksum and replay
        shell: bash
        run: |
          args=(--config "$CONFIG" --env "$ATLAS_ENVIRONMENT" --dir "file://$DIRECTORY")
          if [[ -n "$DEV_URL" ]]; then args+=(--dev-url "$DEV_URL"); fi
          atlas migrate validate "${args[@]}"

      - name: Lint changed migrations
        if: inputs.lint
        shell: bash
        run: |
          args=(--config "$CONFIG" --env "$ATLAS_ENVIRONMENT" --dir "file://$DIRECTORY" --git-base "$BASE_SHA")
          if [[ -n "$DEV_URL" ]]; then args+=(--dev-url "$DEV_URL"); fi
          atlas migrate lint "${args[@]}"

      - name: Test migrations
        if: inputs.test
        shell: bash
        run: |
          args=(--config "$CONFIG" --env "$ATLAS_ENVIRONMENT" --dir "file://$DIRECTORY")
          if [[ -n "$DEV_URL" ]]; then args+=(--dev-url "$DEV_URL"); fi
          atlas migrate test "${args[@]}"

      - name: Publish the migration directory
        if: env.PUBLISH == 'true'
        uses: ariga/atlas-action/migrate/push@be526fa360e6cb745546681470f4760dbbc49cf8
        with:
          config: ${{ inputs.config }}
          env: ${{ inputs.environment }}
          dir: file://${{ inputs.directory }}
          dir-name: ${{ inputs.registry }}
          dev-url: ${{ inputs.dev-url }}
          tag: ${{ env.SOURCE_SHA }}
          latest: ${{ github.event_name != 'pull_request' }}

      - name: Record migration identity
        id: record
        shell: bash
        run: |
          git diff --exit-code -- "$DIRECTORY"
          checksum=$(shasum -a 256 "$DIRECTORY/atlas.sum" | cut -d ' ' -f 1)
          migration=$(jq -cn --arg repository "$REGISTRY" --arg sha "$SOURCE_SHA" \
            --arg checksum "$checksum" --argjson published "$PUBLISH" \
            '{repository: $repository, tag: $sha, revision: $sha, checksum: $checksum, published: $published}')

          echo "published=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
