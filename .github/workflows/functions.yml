name: Deploy central Function code
on:
  workflow_dispatch:
    inputs:
      application:
        description: Key from functions/apps.json
        required: true
        default: profile
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: central-apply
    concurrency:
      group: central-function-${{ inputs.application }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject superseded deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Read reviewed application source
        id: app
        env:
          APPLICATION: ${{ inputs.application }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/function_source.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build locked code package
        env:
          SOURCE_PATH: ${{ steps.app.outputs.path }}
        run: |
          mkdir "$RUNNER_TEMP/function-package"
          cp -R "$SOURCE_PATH/." "$RUNNER_TEMP/function-package/"
          python -m pip install --require-hashes \
            -r "$RUNNER_TEMP/function-package/requirements.txt" \
            --target "$RUNNER_TEMP/function-package/.python_packages/lib/site-packages"
          PYTHONPATH="$RUNNER_TEMP/function-package/.python_packages/lib/site-packages:$RUNNER_TEMP/function-package" \
            python -m unittest discover -s "$SOURCE_PATH/tests" -v
          cd "$RUNNER_TEMP/function-package"
          zip -qr "$RUNNER_TEMP/function.zip" .
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy reviewed package
        env:
          FUNCTION_NAME: ${{ steps.app.outputs.name }}
        run: |
          group=$(az functionapp list --query "[?name=='$FUNCTION_NAME'].resourceGroup | [0]" -o tsv)
          test -n "$group"
          echo "::add-mask::$group"
          az functionapp deployment source config-zip --name "$FUNCTION_NAME" \
            --resource-group "$group" --src "$RUNNER_TEMP/function.zip" --build-remote false --output none
          host=$(az functionapp show --name "$FUNCTION_NAME" --resource-group "$group" --query defaultHostName -o tsv)
          echo "::add-mask::$host"
          WEBHOOK_URL="https://$host/api/github" python3 scripts/verify_webhook.py
