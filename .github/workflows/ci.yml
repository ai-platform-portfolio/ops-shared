name: Shared workflow checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linear:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/linear-issue-check.yml
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
  terraform-only:
    uses: ./.github/workflows/validate.yml
    with:
      terraform-directories: '["tests/fixtures/terraform"]'
  terraform-and-helm:
    uses: ./.github/workflows/validate.yml
    with:
      terraform-directories: '["tests/fixtures/terraform", "tests/fixtures/terraform-second"]'
      helm-chart: tests/fixtures/chart
      helm-release: smoke-test
      helm-namespace: workflow-tests
      helm-values-file: tests/fixtures/chart/override.yaml
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
